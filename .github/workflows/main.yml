name: Construire APK Foot Oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer le projet
        run: |
          if [ -d FootOracle_Android ]; then
            ROOT="$PWD"
          else
            ZIP=$(ls FootOracle_*Complet*.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "ERREUR : ZIP introuvable."
              ls -la
              exit 1
            fi
            echo "Archive utilisée : $ZIP"
            unzip -q "$ZIP" -d extracted
            find extracted -name "*.zip" | while read -r Z; do
              echo "ZIP interne : $Z"
              unzip -q "$Z" -d "$(dirname "$Z")/interne"
            done
            GRADLE_FILE=$(find extracted -maxdepth 10 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
            if [ -z "$GRADLE_FILE" ]; then
              echo "ERREUR : settings.gradle introuvable. Contenu :"
              find extracted | head -80
              exit 1
            fi
            ANDROID_DIR=$(dirname "$GRADLE_FILE")
            ROOT=$(cd "$ANDROID_DIR/.." && pwd)
          fi
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Racine du projet : $ROOT"

      - name: Tests moteur Python
        run: cd "$ROOT/python" && python3 -m unittest discover -s tests

      - name: Tests moteur JavaScript et interface
        run: cd "$ROOT/FootOracle_Android" && node --test tests/engine.test.js tests/ui_smoke.test.js

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les composants Android
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire l'APK debug
        run: gradle -p "$ROOT/FootOracle_Android" assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: FootOracle-APK
          path: ${{ env.ROOT }}/FootOracle_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
